name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://vengeful:test@localhost:5432/vengeful_test?schema=public
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vengeful
          POSTGRES_PASSWORD: test
          POSTGRES_DB: vengeful_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vengeful -d vengeful_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:migrate
      - run: npm run check
      - run: npm run build
      - run: node scripts/check-postgres.mjs
      - run: npm audit --audit-level=high
